services:
  postgres:
    extends:
      file: docker-compose.base.yml
      service: postgres
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

  api:
    extends:
      file: docker-compose.base.yml
      service: api
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    environment:
      NODE_ENV: development
    volumes:
      - ../src:/app/src
      - /app/node_modules

volumes:
  postgres_data_dev:
